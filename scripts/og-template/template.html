<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1200px;
  height: 630px;
  background: #fafaf8;
  font-family: 'Source Serif 4', Georgia, serif;
  position: relative;
  overflow: hidden;
}

.frame {
  position: absolute;
  inset: 40px;
  border: 2px solid #1a1a17;
}

.topline {
  position: absolute;
  top: 40px; left: 40px; right: 40px;
  height: 44px;
  border-bottom: 1px solid #d4d2c8;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  color: #93917f;
  letter-spacing: 0.02em;
}

.content {
  position: absolute;
  top: 124px; left: 80px; right: 80px; bottom: 110px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.category-tag {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 7px 16px;
  border: 1.5px solid #8a3324;
  color: #8a3324;
  margin-bottom: 32px;
  width: fit-content;
}

.title {
  font-size: 54px;
  font-weight: 700;
  line-height: 1.22;
  color: #1a1a17;
  letter-spacing: -0.015em;
  max-width: 920px;
}

.bottomline {
  position: absolute;
  bottom: 40px; left: 40px; right: 40px;
  height: 50px;
  border-top: 1px solid #d4d2c8;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  color: #5c5a4f;
}

.logo { font-weight: 600; }
.logo .mark { color: #8a3324; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="topline">
    <span>RTN(7) — Manual de RedTeamNotes</span>
    <span>{{AUTHOR}}</span>
  </div>
  <div class="content">
    <div class="category-tag">{{CATEGORY}}</div>
    <div class="title">{{TITLE}}</div>
  </div>
  <div class="bottomline">
    <span class="logo"><span class="mark">~/</span>RedTeamNotes</span>
    <span>redteamnotes.github.io</span>
  </div>
</body>
</html>
